<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tracker Premium V8</title>
    <!-- Inyectamos Chart.js para las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Paleta Deep Dark Premium */
            --bg-color: #09090b; --surface-color: #18181b; --surface-elevated: #27272a;
            --primary-color: #8b5cf6; --primary-gradient: linear-gradient(135deg, #8b5cf6, #6d28d9);
            --secondary-color: #14b8a6; --cardio-color: #f97316; --cardio-gradient: linear-gradient(135deg, #f97316, #ea580c);
            --danger-color: #ef4444; --text-color: #f4f4f5; --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px; --radius-md: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 20px); --safe-top: env(safe-area-inset-top, 40px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.5; overflow-x: hidden;}

        header { padding: calc(15px + var(--safe-top)) 20px 15px; text-align: center; background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        h1 { margin: 0; font-size: 1.25rem; font-weight: 700; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { padding: 20px 15px calc(90px + var(--safe-bottom)) 15px; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        select, input, textarea { width: 100%; padding: 14px; margin-bottom: 12px; background-color: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; font-family: inherit; transition: border-color 0.2s; outline: none;}
        select:focus, input:focus, textarea:focus { border-color: var(--primary-color); }
        textarea { resize: vertical; min-height: 80px; }

        .card { background-color: var(--surface-color); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 18px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;}
        .card h3 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text-color); }
        .target-box { display: inline-block; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;}
        .muscle-tag { background-color: rgba(20, 184, 166, 0.15); color: var(--secondary-color); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }

        /* Meta de la sesión (Fecha y Horas) */
        .session-meta { display: flex; gap: 8px; margin-bottom: 15px; }
        .session-meta > div { flex: 1; }
        .session-meta label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600; text-transform: uppercase;}
        .session-meta input { padding: 10px; margin-bottom: 0; font-size: 0.9rem;}

        /* Diseño de Series (Tabla actualizada para 3 inputs) */
        .sets-header { display: flex; gap: 8px; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 8px; padding-left: 48px;}
        .sets-header > div { flex: 1; text-align: center; }
        .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px;}
        .set-row > span { width: 40px; font-weight: 600; font-size: 0.9rem; text-align: center; color: var(--text-muted); flex-shrink: 0;}
        .set-row input { margin-bottom: 0; text-align: center; padding: 10px 4px; border: none; background: var(--surface-elevated); font-size: 1.1rem; flex: 1; min-width: 0; border-radius: 6px;}

        /* Botones */
        .btn-add-set { background-color: transparent; border: 1px dashed var(--border-color); color: var(--text-muted); font-size: 0.85rem; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; cursor: pointer; transition: 0.2s;}
        .btn-add-set:active { background-color: var(--surface-elevated); }
        .btn-secondary { background-color: rgba(139, 92, 246, 0.1); border: 1px dashed var(--primary-color); color: var(--primary-color); width: 100%; padding: 14px; border-radius: var(--radius-md); font-weight: 600; margin-bottom: 15px; cursor: pointer;}
        .btn-save { background: var(--primary-gradient); color: #fff; width: 100%; padding: 16px; font-size: 1.1rem; font-weight: bold; border: none; margin-top: 10px; margin-bottom: 10px; border-radius: var(--radius-md); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); cursor: pointer;}
        .btn-save-cardio { background: var(--cardio-gradient); box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); }
        .btn-delete { background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger-color); font-size: 1.2rem; cursor: pointer; padding: 0 16px; border-radius: var(--radius-md);}
        .btn-edit-small { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin-top: 10px; }

        .rule-box { background-color: rgba(139, 92, 246, 0.1); border-left: 4px solid var(--primary-color); padding: 12px 16px; margin-bottom: 20px; border-radius: 0 var(--radius-md) var(--radius-md) 0; font-size: 0.9rem; }

        /* Builder (Editor) */
        .builder-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: stretch; background: var(--surface-elevated); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color);}
        .builder-row input, .builder-row select { margin-bottom: 0; background: var(--surface-color); border-color: transparent;}
        .builder-inputs { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .builder-flex { display: flex; gap: 8px; }

        /* Stats */
        .stats-nav { display: flex; background: var(--surface-color); padding: 4px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color);}
        .stats-nav button { flex: 1; background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; padding: 10px 4px; border-radius: 8px; transition: 0.3s; }
        .stats-nav button.active { background: var(--surface-elevated); color: var(--text-color); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .stat-view { display: none; } .stat-view.active { display: block; animation: fadeIn 0.3s ease; }
        .stat-row { padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .stat-row:last-child { border-bottom: none; }
        .stat-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: var(--primary-color); font-size: 0.9rem;}
        .stat-sets { display: flex; flex-wrap: wrap; gap: 8px; }
        .stat-set-badge { background-color: var(--surface-elevated); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 8px; font-size: 0.85rem; color: var(--text-color); }
        
        .chart-container { position: relative; height: 220px; width: 100%; margin-bottom: 20px; margin-top: 10px; }

        .habit-block { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        .habit-block h4 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;}
        .habit-block .number { font-size: 2.8rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; line-height: 1;}
        .day-bar-container { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.85rem; font-weight: 500;}
        .day-bar-label { width: 80px; text-align: right; color: var(--text-muted);}
        .day-bar-track { flex-grow: 1; background: var(--surface-elevated); height: 8px; border-radius: 4px; overflow: hidden; }
        .day-bar-fill { height: 100%; background: var(--primary-gradient); width: 0%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .day-bar-count { width: 30px; font-weight: bold; }

        /* Calendario Premium */
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cal-btn { width: 40px; height: 40px; border-radius: 20px; background: var(--surface-elevated); border: none; color: var(--text-color); display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .cal-day-name { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 10px; text-transform: uppercase;}
        .cal-cell { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 0.95rem; font-weight: 500; cursor: pointer; position: relative; transition: 0.2s;}
        .cal-cell.today { background: rgba(255,255,255,0.1); color: #fff;}
        .cal-cell.empty { background: transparent; cursor: default; }
        .cal-indicators { position: absolute; bottom: 4px; display: flex; gap: 3px; }
        .dot { width: 4px; height: 4px; border-radius: 50%; }
        .dot.strength { background-color: var(--primary-color); box-shadow: 0 0 4px var(--primary-color);}
        .dot.cardio { background-color: var(--cardio-color); box-shadow: 0 0 4px var(--cardio-color);}

        /* Modal Bottom Sheet */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 200; align-items: flex-end; }
        .modal-overlay.active { display: flex; animation: fadeInModal 0.3s ease; }
        .modal-content { background: var(--surface-color); width: 100%; max-height: 85vh; border-radius: 24px 24px 0 0; padding: 24px 20px calc(20px + var(--safe-bottom)); overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-handle { width: 40px; height: 5px; background: var(--surface-elevated); border-radius: 3px; margin: 0 auto 20px; }
        .modal-title { font-size: 1.3rem; font-weight: 700; color: var(--text-color); margin-bottom: 20px; text-align: center;}
        
        .summary-card { background: var(--surface-elevated); padding: 16px; border-radius: var(--radius-md); margin-bottom: 12px; border: 1px solid var(--border-color); }
        .summary-card h4 { margin: 0 0 8px 0; color: var(--primary-color); font-size: 1.05rem;}
        .summary-card.cardio-theme h4 { color: var(--cardio-color); }
        .summary-detail { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 4px;}
        .tonnage-badge { display: inline-block; background: rgba(139, 92, 246, 0.15); color: var(--primary-color); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin-top: 10px; border: 1px solid rgba(139, 92, 246, 0.3); }
        
        /* Nav Inferior (iOS Tab Bar Style) */
        .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid var(--border-color); padding: 10px 10px calc(10px + var(--safe-bottom)); z-index: 100; justify-content: space-around; }
        .nav-item { background: transparent; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; gap: 4px; transition: 0.2s; width: 33%;}
        .nav-icon { font-size: 1.4rem; filter: grayscale(1) opacity(0.7); transition: 0.2s;}
        .nav-item.active { color: var(--primary-color); }
        .nav-item.active .nav-icon { filter: none; transform: scale(1.1); }

        .backup-btn { background-color: var(--surface-elevated); border: 1px solid var(--border-color); color: var(--text-color); font-size: 0.9rem; font-weight: 600; padding: 12px; flex: 1; text-align: center; border-radius: var(--radius-md); cursor: pointer;}
        #toast { visibility: hidden; min-width: 250px; background: rgba(20, 184, 166, 0.9); backdrop-filter: blur(8px); color: #fff; text-align: center; border-radius: 100px; padding: 14px 20px; position: fixed; z-index: 1000; left: 50%; bottom: calc(100px + var(--safe-bottom)); transform: translateX(-50%) translateY(20px); font-size: 0.95rem; font-weight: bold; opacity: 0; transition: all 0.3s ease;}
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
        @keyframes fadeInModal { from {opacity: 0;} to {opacity: 1;} }
    </style>
</head>
<body>

    <header>
        <h1>Tracker Premium</h1>
    </header>

    <div class="container">
        <!-- SECCIÓN ENTRENAR -->
        <div id="section-train" class="section active">
            <select id="day-selector" onchange="loadDay()">
                <option value="">-- Selecciona el Entrenamiento --</option>
                <option value="CARDIO">🏃 Registrar Cardio</option>
            </select>
            <div id="workout-container"></div>
        </div>

        <!-- SECCIÓN EDITOR -->
        <div id="section-build" class="section">
            <div class="card" style="padding: 12px;">
                <select id="routine-edit-select" onchange="loadRoutineForEdit()" style="margin: 0; border: none; background: transparent; font-weight: 600;">
                    <option value="NEW">+ Crear Nueva Rutina</option>
                </select>
            </div>
            <div class="card">
                <input type="text" id="new-routine-name" placeholder="Nombre (ej. Torso C, Push, etc.)">
                <input type="text" id="new-routine-rule" placeholder="Regla/Nota (ej. Descanso 2 min)">
                <div id="builder-exercises"></div>
                <button class="btn-secondary" onclick="addBuilderExerciseRow()">+ Añadir Ejercicio a la rutina</button>
                <div style="display:flex; gap:10px; margin-top: 10px;">
                    <button id="btn-delete-routine" class="btn-delete" onclick="deleteCurrentRoutine()" style="display:none;">🗑️ Eliminar</button>
                    <button class="btn-save" onclick="saveCustomRoutine()" style="margin:0;">Guardar Rutina</button>
                </div>
            </div>
        </div>

        <!-- SECCIÓN ESTADÍSTICAS -->
        <div id="section-stats" class="section">
            <div class="stats-nav">
                <button id="sbtn-calendar" class="active" onclick="switchStatView('calendar')">Calendario</button>
                <button id="sbtn-habits" onclick="switchStatView('habits')">Hábitos</button>
                <button id="sbtn-muscles" onclick="switchStatView('muscles')">Volumen</button>
                <button id="sbtn-exercises" onclick="switchStatView('exercises')">Historial</button>
            </div>

            <!-- Vista Calendario -->
            <div id="stat-view-calendar" class="stat-view active card">
                <div class="cal-header">
                    <button class="cal-btn" onclick="changeMonth(-1)">&#10094;</button>
                    <h3 id="cal-month-year" style="margin:0; font-size:1.1rem; color:var(--text-color);">Mes Año</h3>
                    <button class="cal-btn" onclick="changeMonth(1)">&#10095;</button>
                </div>
                <div class="cal-grid">
                    <div class="cal-day-name">L</div><div class="cal-day-name">M</div><div class="cal-day-name">X</div>
                    <div class="cal-day-name">J</div><div class="cal-day-name">V</div><div class="cal-day-name">S</div><div class="cal-day-name">D</div>
                </div>
                <div id="cal-body" class="cal-grid" style="margin-top: 5px;"></div>
            </div>

            <!-- Vista Hábitos -->
            <div id="stat-view-habits" class="stat-view card">
                <h3 style="margin-bottom: 20px;">Últimos 30 días</h3>
                <div id="habits-container"></div>
            </div>

            <!-- Vista Músculos -->
            <div id="stat-view-muscles" class="stat-view card">
                <h3 style="margin-bottom: 5px;">Series Efectivas</h3>
                <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Volumen de fuerza (30 días)</div>
                <div id="muscles-container"></div>
            </div>

            <!-- Vista Ejercicios (Con Gráfica) -->
            <div id="stat-view-exercises" class="stat-view card">
                <select id="stat-exercise-selector" onchange="loadExerciseStats()">
                    <option value="">-- Selecciona un Ejercicio --</option>
                </select>
                <!-- Contenedor para Chart.js -->
                <div class="chart-container" style="display:none;" id="chart-wrapper">
                    <canvas id="trendChart"></canvas>
                </div>
                <div id="stats-list" style="margin-top: 15px;"></div>
            </div>

            <!-- COPIA DE SEGURIDAD -->
            <div class="card">
                <h3 style="margin-bottom: 5px;">💾 Copia de Seguridad</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Tus datos se guardan en tu móvil. Exporta una copia periódicamente.</p>
                <div style="display: flex; gap: 10px;">
                    <button class="backup-btn" onclick="exportBackup()">⬇️ Exportar</button>
                    <button class="backup-btn" onclick="document.getElementById('import-file').click()">⬆️ Importar</button>
                    <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importBackup(event)">
                </div>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR iOS -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('train')" id="btn-train"><span class="nav-icon">🏋️</span> Entrenar</button>
        <button class="nav-item" onclick="switchTab('build')" id="btn-build"><span class="nav-icon">⚙️</span> Editor</button>
        <button class="nav-item" onclick="switchTab('stats')" id="btn-stats"><span class="nav-icon">📊</span> Datos</button>
    </nav>

    <!-- MODAL CALENDARIO (BOTTOM SHEET) -->
    <div class="modal-overlay" id="day-modal" onclick="closeModal(event)">
        <div class="modal-content" id="modal-content" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <h3 class="modal-title" id="modal-date-title">Fecha</h3>
            <div id="modal-summaries"></div>
        </div>
    </div>

    <div id="toast">✅ Acción completada</div>

    <script>
        // === DATOS BASE ===
        const M_CHEST = "Pecho", M_BACK = "Espalda", M_SHOULDER = "Hombros", M_QUADS = "Cuádriceps", M_HAMS = "Isquios", M_GLUTES = "Glúteos", M_BICEPS = "Bíceps", M_TRICEPS = "Tríceps", M_CALVES = "Gemelos", M_CORE = "Core", M_OTHER = "Otro";
        const muscleOptions = [M_CHEST, M_BACK, M_SHOULDER, M_QUADS, M_HAMS, M_GLUTES, M_BICEPS, M_TRICEPS, M_CALVES, M_CORE, M_OTHER];

        const baseRoutine = {
            dia1: { title: "DÍA 1: Torso A", rule: "Excéntrica 3 seg. Descanso: 60-90s.", exercises: [
                { id: "d1_jalon", name: "Jalón al pecho (Neutro/V)", sets: 4, target: "8-10 reps", muscle: M_BACK },
                { id: "d1_press", name: "Press pecho convergente", sets: 4, target: "8-10 reps", muscle: M_CHEST },
                { id: "d1_elev", name: "Elevaciones laterales", sets: 4, target: "12-15 reps", muscle: M_SHOULDER },
                { id: "d1_tri", name: "Tríceps polea alta", sets: 3, target: "10-12 reps", muscle: M_TRICEPS },
                { id: "d1_bi", name: "Curl bíceps Scott", sets: 3, target: "10-12 reps", muscle: M_BICEPS },
                { id: "d1_pl", name: "Plancha retroversión", sets: 3, target: "40 seg", muscle: M_CORE }
            ]},
            dia2: { title: "DÍA 2: Pierna A", rule: "Excéntrica 3 seg. Columna neutra. Descanso: 90s.", exercises: [
                { id: "d2_hip", name: "Hip Thrust", sets: 4, target: "8-10 reps", muscle: M_GLUTES },
                { id: "d2_pren", name: "Prensa Inclinada", sets: 4, target: "10-12 reps", muscle: M_QUADS },
                { id: "d2_curl", name: "Curl Isquios sentado", sets: 4, target: "10-12 reps", muscle: M_HAMS },
                { id: "d2_ext", name: "Silla Romana (Glúteo)", sets: 3, target: "12-15 reps", muscle: M_GLUTES },
                { id: "d2_gem", name: "Gemelos de pie", sets: 3, target: "15 reps", muscle: M_CALVES }
            ]},
            dia3: { title: "DÍA 3: Torso B", rule: "Excéntrica 3 seg. Descanso: 60-90s.", exercises: [
                { id: "d3_rem", name: "Remo pecho apoyado", sets: 4, target: "8-10 reps", muscle: M_BACK },
                { id: "d3_pinc", name: "Press inclinado Mancuernas", sets: 3, target: "8-10 reps", muscle: M_CHEST },
                { id: "d3_land", name: "Landmine Press (1 brazo)", sets: 3, target: "8-10 reps", muscle: M_SHOULDER },
                { id: "d3_face", name: "Face Pull polea alta", sets: 4, target: "15 reps", muscle: M_BACK },
                { id: "d3_tri", name: "Extensiones tríceps cruzadas", sets: 3, target: "12 reps", muscle: M_TRICEPS },
                { id: "d3_bi", name: "Curl bíceps martillo", sets: 3, target: "12 reps", muscle: M_BICEPS }
            ]},
            dia4: { title: "DÍA 4: Pierna B (Casa)", rule: "Densidad metabólica. Descanso: 60-90s.", exercises: [
                { id: "d4_bul", name: "Sentadilla Búlgara", sets: 4, target: "8-10 reps / pierna", muscle: M_QUADS },
                { id: "d4_push", name: "Flexiones estrictas", sets: 3, target: "Al fallo", muscle: M_CHEST },
                { id: "d4_bst", name: "B-Stance RDL", sets: 3, target: "12 reps / pierna", muscle: M_HAMS },
                { id: "d4_abd", name: "Abducción cadera (Banda)", sets: 3, target: "15 reps / pierna", muscle: M_GLUTES },
                { id: "d4_pal", name: "Press Pallof", sets: 3, target: "12 reps / lado", muscle: M_CORE },
                { id: "d4_bird", name: "Bird-Dog", sets: 3, target: "10 reps / lado", muscle: M_CORE }
            ]}
        };

        // Estado Global
        let currentEditWorkoutId = null;
        let trendChartInstance = null;

        function getMergedRoutines() {
            const custom = JSON.parse(localStorage.getItem('custom_routines') || '{}');
            const hidden = JSON.parse(localStorage.getItem('hidden_routines') || '[]');
            let merged = JSON.parse(JSON.stringify(baseRoutine)); 
            Object.assign(merged, custom);
            hidden.forEach(id => { delete merged[id]; });
            return merged;
        }

        function getMetaHTML(dateStr = "", startStr = "", endStr = "") {
            // Helpers para rellenar campos por defecto
            const now = new Date();
            const d = dateStr || now.toISOString().split('T')[0];
            const s = startStr || now.toTimeString().substring(0,5);
            return `
            <div class="card session-meta">
                <div><label>Fecha</label><input type="date" id="w-date" value="${d}"></div>
                <div><label>Inicio</label><input type="time" id="w-start" value="${s}"></div>
                <div><label>Fin</label><input type="time" id="w-end" value="${endStr}"></div>
            </div>`;
        }

        function loadDay(editData = null) {
            const dayKey = document.getElementById('day-selector').value;
            const container = document.getElementById('workout-container');
            container.innerHTML = '';
            if (!dayKey) return;

            if (dayKey === 'CARDIO') { renderCardioForm(container, editData); return; }

            const routines = getMergedRoutines();
            let dayData = routines[dayKey];
            
            // Reconstruir DayData si estamos editando una rutina borrada
            if (editData && !dayData) {
                dayData = { title: "Rutina Recuperada", exercises: [] };
                for(let exId in editData.exercises) {
                    dayData.exercises.push({ id: exId, name: editData.exerciseMetadata[exId]?.name || 'Ejercicio', muscle: editData.exerciseMetadata[exId]?.muscle || M_OTHER, sets: editData.exercises[exId].length, target: "-" });
                }
            }

            const draft = JSON.parse(localStorage.getItem('draft_' + dayKey) || 'null');
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const lastWorkout = history.filter(w => w.dayId === dayKey && w.type !== 'cardio').pop();

            let html = ``;
            if(editData) {
                html += `<div style="text-align:center; font-size:0.9rem; color:var(--primary-color); font-weight:bold; margin-bottom:10px;">✏️ Modo Edición</div>`;
                html += getMetaHTML(editData.recordDate || editData.date.split('T')[0], editData.startTime, editData.endTime);
            } else {
                if (draft && draft.exercises && draft.exercises.length > 0) html += `<div style="text-align:center; font-size:0.8rem; color:var(--secondary-color); margin-bottom:10px;">Borrador recuperado</div>`;
                if(dayData.rule) html += `<div class="rule-box"><strong>Nota:</strong> ${dayData.rule}</div>`;
                html += getMetaHTML();
            }
            
            html += `<div id="exercise-list">`;

            const sourceData = editData ? editData : (draft && draft.exercises.length > 0 ? draft : null);

            if (sourceData && sourceData.exercises) {
                // Renderizar desde Edit o Draft
                const exArray = editData ? dayData.exercises : sourceData.exercises; 
                exArray.forEach((ex, index) => {
                    let setsData = editData ? sourceData.exercises[ex.id] : ex.sets;
                    if(!setsData) setsData = []; // Parche de seguridad
                    html += buildCardHTML(ex.id, ex.name, ex.target, ex.muscle, setsData, index + 1);
                });
            } else {
                // Nuevo entrenamiento base
                dayData.exercises.forEach((ex, index) => {
                    let prefilledSets = [];
                    for (let i = 0; i < ex.sets; i++) {
                        let w = "", r = "", rir = "";
                        if (lastWorkout && lastWorkout.exercises && lastWorkout.exercises[ex.id] && lastWorkout.exercises[ex.id][i]) {
                            w = lastWorkout.exercises[ex.id][i].weight; r = lastWorkout.exercises[ex.id][i].reps; rir = lastWorkout.exercises[ex.id][i].rir || "";
                        }
                        prefilledSets.push({ weight: w, reps: r, rir: rir });
                    }
                    html += buildCardHTML(ex.id, ex.name, ex.target, ex.muscle, prefilledSets, index + 1);
                });
            }

            html += `</div>`;
            html += `<button class="btn-secondary" onclick="addExtraExercise('${dayKey}')">+ Ejercicio Extra (Puntual)</button>`;
            html += `<button class="btn-save" onclick="saveWorkout('${dayKey}')">${editData ? 'Actualizar Sesión' : 'Guardar Sesión'}</button>`;
            if(editData) html += `<button class="btn-secondary" style="color:var(--text-color); border-color:var(--text-muted);" onclick="cancelEdit()">Cancelar Edición</button>`;
            container.innerHTML = html;
        }

        function buildCardHTML(id, name, target, muscle, setsData, index = "*") {
            const safeMuscle = muscle || M_OTHER;
            let html = `
            <div class="card workout-card" id="ex-${id}" data-name="${name}" data-target="${target}" data-muscle="${safeMuscle}">
                <div class="card-header"><h3>${index}. ${name}</h3><span class="muscle-tag">${safeMuscle}</span></div>
                <div class="target-box">🎯 ${target}</div>
                <div class="sets-header"><div style="text-align:left; flex: 1.2;">Kg</div><div>Reps</div><div>RIR</div></div>

            setsData.forEach((set, i) => {
                html += `
                <div class="set-row">
                    <span>${i + 1}</span>
                    <input type="number" inputmode="decimal" class="weight-input" placeholder="-" value="${set.weight}" oninput="autoSaveDraft()">
                    <input type="number" inputmode="decimal" class="reps-input" placeholder="-" value="${set.reps}" oninput="autoSaveDraft()">
                    <input type="number" inputmode="decimal" class="rir-input" placeholder="-" value="${set.rir || ''}" oninput="autoSaveDraft()">

            });

        function addDynamicSet(exId) {
            const card = document.getElementById('ex-' + exId);
            const setsContainer = card.querySelector('.sets-container');
            const currentSets = setsContainer.querySelectorAll('.set-row').length;
            const newSetHtml = `
                <div class="set-row" style="animation: fadeIn 0.3s ease;">
                    <span>${currentSets + 1}</span>
                    <input type="number" inputmode="decimal" class="weight-input" placeholder="-" value="" oninput="autoSaveDraft()">
                    <input type="number" inputmode="decimal" class="reps-input" placeholder="-" value="" oninput="autoSaveDraft()">

                </div>`;
            setsContainer.insertAdjacentHTML('beforeend', newSetHtml);
            autoSaveDraft();

        function addExtraExercise(dayKey) {
            const name = prompt("Nombre del ejercicio extra:"); if (!name) return;

            const target = prompt("Repeticiones objetivo:", "8-12 reps") || "Según sensaciones";

        function autoSaveDraft() {
            if(currentEditWorkoutId) return; // No auto-guardar borradores si estamos editando
            const dayKey = document.getElementById('day-selector').value;
            if(!dayKey || dayKey === 'CARDIO') return;

            const cards = document.querySelectorAll('.workout-card');
            const draftData = { exercises: [] };

            cards.forEach(card => {
                const exId = card.id.replace('ex-', '');
                const sets = [];
                card.querySelectorAll('.weight-input').forEach((wInput, i) => {
                    const rInput = card.querySelectorAll('.reps-input')[i];
                    const rirInput = card.querySelectorAll('.rir-input')[i];
                    sets.push({ weight: wInput.value, reps: rInput.value, rir: rirInput.value });
                });
                draftData.exercises.push({ id: exId, name: card.getAttribute('data-name'), target: card.getAttribute('data-target'), muscle: card.getAttribute('data-muscle'), sets: sets });
            });
            localStorage.setItem('draft_' + dayKey, JSON.stringify(draftData));

        function saveWorkout(dayId) {
            const cards = document.querySelectorAll('.workout-card');
            if(cards.length === 0) return;

            const dDate = document.getElementById('w-date').value;
            const dStart = document.getElementById('w-start').value;
            let dEnd = document.getElementById('w-end').value;
            if(!dEnd) { dEnd = new Date().toTimeString().substring(0,5); } // Auto-completar fin

            const workoutRecord = {
                id: currentEditWorkoutId || Date.now().toString(),
                date: new Date(`${dDate}T${dStart || '12:00'}:00`).toISOString(), // Fecha ISO real
                recordDate: dDate,
                startTime: dStart,
                endTime: dEnd,
                dayId: dayId,
                type: 'strength',
                exercises: {},
                exerciseMetadata: {} 
            };

            cards.forEach(card => {
                const exId = card.id.replace('ex-', ''); const name = card.getAttribute('data-name'); const muscle = card.getAttribute('data-muscle');
                let setsData = [];
                card.querySelectorAll('.weight-input').forEach((wInput, i) => {
                    const rInput = card.querySelectorAll('.reps-input')[i];
                    const rirInput = card.querySelectorAll('.rir-input')[i];
                    setsData.push({ weight: wInput.value || "", reps: rInput.value || "", rir: rirInput.value || "" });
                });
                workoutRecord.exercises[exId] = setsData;
                workoutRecord.exerciseMetadata[exId] = { name: name, muscle: muscle };
            });

            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            
            if(currentEditWorkoutId) {
                const idx = history.findIndex(x => x.id === currentEditWorkoutId || x.date === currentEditWorkoutId);
                if(idx !== -1) history[idx] = workoutRecord; else history.push(workoutRecord);

                history.push(workoutRecord);
                showToast("Entrenamiento Guardado 🏆");

            localStorage.setItem('workout_history', JSON.stringify(history));
            localStorage.removeItem('draft_' + dayId);
            
            document.getElementById('day-selector').value = "";
            document.getElementById('workout-container').innerHTML = "";
            switchTab('stats');
        }

        function saveCardio() {
            const modality = document.getElementById('c-modality').value;
            const duration = document.getElementById('c-duration').value;
            if(!duration) { alert("Añade al menos la duración en minutos"); return; }

            const dDate = document.getElementById('w-date').value;
            const dStart = document.getElementById('w-start').value;
            let dEnd = document.getElementById('w-end').value;

            const record = {
                id: currentEditWorkoutId || Date.now().toString(),
                date: new Date(`${dDate}T${dStart || '12:00'}:00`).toISOString(),
                recordDate: dDate,
                startTime: dStart,
                endTime: dEnd,
                type: 'cardio',
                modality: modality,
                duration: duration,
                distance: document.getElementById('c-distance').value,
                cal: document.getElementById('c-cal').value,
                fcMed: document.getElementById('c-fcmed').value,
                fcMax: document.getElementById('c-fcmax').value,
                notes: document.getElementById('c-notes').value
            };

            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            if(currentEditWorkoutId) {
                const idx = history.findIndex(x => x.id === currentEditWorkoutId || x.date === currentEditWorkoutId);
                if(idx !== -1) history[idx] = record; else history.push(record);
                currentEditWorkoutId = null;
                showToast("Cardio Actualizado ✅");
            } else {
                history.push(record);
                showToast("Cardio guardado 🏃‍♂️");
            }

            localStorage.setItem('workout_history', JSON.stringify(history));
            document.getElementById('day-selector').value = "";
            document.getElementById('workout-container').innerHTML = "";
            switchTab('stats');
        }

        function getRecentHistory(days = 30) {
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
            return history.filter(w => new Date(w.date) >= cutoff);

        /* Omito renders de Hábitos y Músculos por brevedad de la respuesta, son iguales */
        function renderHabitsStats() {
            const history30 = getRecentHistory(30); const container = document.getElementById('habits-container');
            if (history30.length === 0) { container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>No hay datos recientes.</p>"; return; }
            const dayNames = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"]; const dayCounts = [0,0,0,0,0,0,0];
            history30.forEach(w => { dayCounts[new Date(w.date).getDay()]++; });
            const maxDays = Math.max(...dayCounts); const favDayIdx = dayCounts.indexOf(maxDays);
            let html = `<div class="habit-block"><h4 style="color:var(--text-muted)">Sesiones Totales</h4><div class="number">${history30.length}</div></div><div class="habit-block"><h4 style="color:var(--text-muted)">Día Favorito</h4><div class="number" style="font-size:1.8rem;">${dayNames[favDayIdx]}</div></div><div style="margin-top: 25px;"><h4 style="margin-bottom:15px; font-size:0.9rem; color:var(--text-muted); text-transform:uppercase;">Distribución Semanal</h4>`;
            [1, 2, 3, 4, 5, 6, 0].forEach(dayIdx => {
                const width = maxDays > 0 ? (dayCounts[dayIdx] / maxDays) * 100 : 0;
                html += `<div class="day-bar-container"><div class="day-bar-label">${dayNames[dayIdx].substring(0,3)}.</div><div class="day-bar-track"><div class="day-bar-fill" style="width: ${width}%;"></div></div><div class="day-bar-count">${dayCounts[dayIdx]}</div></div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        function renderMuscleStats() {
            const history30 = getRecentHistory(30); const container = document.getElementById('muscles-container');
            const muscleTally = {};
            history30.filter(w => w.type !== 'cardio').forEach(w => {
                for (const exId in w.exercises) {
                    const validSets = w.exercises[exId].filter(s => s.weight !== "" || s.reps !== "").length;
                    if (validSets > 0 && w.exerciseMetadata && w.exerciseMetadata[exId]) {
                        const m = w.exerciseMetadata[exId].muscle || M_OTHER; muscleTally[m] = (muscleTally[m] || 0) + validSets;
                    }
                }
            });
            const sortedMuscles = Object.keys(muscleTally).sort((a,b) => muscleTally[b] - muscleTally[a]);
            if (sortedMuscles.length === 0) { container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>Sin datos de fuerza recientes.</p>"; return; }
            let html = ""; const maxSets = muscleTally[sortedMuscles[0]];
            sortedMuscles.forEach(m => {
                html += `<div class="day-bar-container"><div class="day-bar-label" style="text-align:left;">${m}</div><div class="day-bar-track"><div class="day-bar-fill" style="width: ${(muscleTally[m] / maxSets) * 100}%;"></div></div><div class="day-bar-count">${muscleTally[m]}</div></div>`;
            });
            container.innerHTML = html;
        }

        function populateStatsDropdown() {
            const select = document.getElementById('stat-exercise-selector');
            select.innerHTML = '<option value="">-- Selecciona un Ejercicio --</option>';
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const routines = getMergedRoutines();
            let allExercises = {};

            Object.values(routines).forEach(day => { day.exercises.forEach(ex => { allExercises[ex.id] = ex.name; }); });
            history.forEach(w => {
                if(w.exerciseMetadata) { Object.keys(w.exerciseMetadata).forEach(id => { if (!allExercises[id]) allExercises[id] = w.exerciseMetadata[id].name; }); }
            });

            const sortedIds = Object.keys(allExercises).sort((a, b) => allExercises[a].localeCompare(allExercises[b]));
            sortedIds.forEach(id => {
                const opt = document.createElement('option'); opt.value = id; opt.textContent = allExercises[id]; select.appendChild(opt);
            });
        }

        function loadExerciseStats() {
            const exId = document.getElementById('stat-exercise-selector').value;
            const list = document.getElementById('stats-list');
            const chartWrapper = document.getElementById('chart-wrapper');
            
            if (!exId) { list.innerHTML = ''; chartWrapper.style.display = 'none'; return; }

            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const exStats = [];

            // Datos ordenados cronológicamente para la gráfica
            history.forEach(w => {
                if (w.type !== 'cardio' && w.exercises[exId]) {
                    const hasData = w.exercises[exId].some(set => set.weight !== "" || set.reps !== "");
                    if (hasData) {
                        const dateObj = new Date(w.date);
                        exStats.push({ 
                            rawDate: dateObj,
                            dateStr: dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 
                            sets: w.exercises[exId] 
                        });
                    }
                }
            });

            if (exStats.length === 0) { 
                list.innerHTML = '<p style="text-align: center; color:var(--text-muted); margin-top:20px;">No hay datos aún.</p>'; 
                chartWrapper.style.display = 'none'; 
                return; 
            }

            // Preparar datos para Chart.js (Cálculo 1RM Epley)
            const chartLabels = [];
            const chartData = [];

            exStats.forEach(stat => {
                chartLabels.push(stat.rawDate.toLocaleDateString(undefined, {month:'short', day:'numeric'}));
                let best1RM = 0;
                stat.sets.forEach(set => {
                    let w = parseFloat(set.weight); let r = parseInt(set.reps);
                    if(!isNaN(w) && !isNaN(r) && r > 0) {
                        let rm = w * (1 + 0.0333 * r); // Epley Formula
                        if(rm > best1RM) best1RM = rm;
                    }
                });
                chartData.push(best1RM.toFixed(1));
            });

            // Renderizar Gráfica
            chartWrapper.style.display = 'block';
            if(trendChartInstance) trendChartInstance.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            // Forzar colores oscuros para la gráfica
            Chart.defaults.color = '#a1a1aa';
            Chart.defaults.font.family = '-apple-system, sans-serif';

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: '1RM Estimado (Kg)',
                        data: chartData,
                        borderColor: '#8b5cf6', // Primary color
                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#14b8a6', // Secondary color
                        pointBorderWidth: 0,
                        pointRadius: 4,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: false },
                        x: { grid: { display: false } }
                    }
                }
            });

            // Renderizar Lista
            list.innerHTML = "";
            [...exStats].reverse().forEach(stat => {
                let setsHtml = '';
                stat.sets.forEach((set, idx) => {
                    if (set.weight !== "" || set.reps !== "") { 
                        let rirStr = set.rir ? ` <span style="color:#14b8a6; font-size:0.7rem;">(RIR ${set.rir})</span>` : '';
                        setsHtml += `<div class="stat-set-badge">S${idx + 1}: ${set.weight||'-'}kg × ${set.reps||'-'}${rirStr}</div>`; 
                    }
                });
                list.innerHTML += `<div class="stat-row"><div class="stat-header"><span>${stat.dateStr}</span></div><div class="stat-sets">${setsHtml}</div></div>`;
            });
        }

        // === CALENDARIO ===
        let calDate = new Date();
        function initCalendar() { renderCalendar(); }
        function changeMonth(dir) { calDate.setMonth(calDate.getMonth() + dir); renderCalendar(); }

        function renderCalendar() {
            const monthYearEl = document.getElementById('cal-month-year');
            const bodyEl = document.getElementById('cal-body');
            bodyEl.innerHTML = '';

            const year = calDate.getFullYear(); const month = calDate.getMonth();
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            monthYearEl.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            
            const offset = (firstDay + 6) % 7;
            for(let i=0; i<offset; i++) { bodyEl.innerHTML += `<div class="cal-cell empty"></div>`; }

            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');

            for(let day=1; day<=daysInMonth; day++) {
                const currentCellDate = new Date(year, month, day);
                let hasStrength = false, hasCardio = false;

                history.forEach(w => {
                    const wDate = new Date(w.date);
                    if(wDate.getFullYear() === year && wDate.getMonth() === month && wDate.getDate() === day) {
                        if(w.type === 'cardio') hasCardio = true; else hasStrength = true;
                    }
                });

                let classes = 'cal-cell';
                if(currentCellDate.toDateString() === today.toDateString()) classes += ' today';
                
                let indicators = '';
                if(hasStrength) indicators += '<div class="dot strength"></div>';
                if(hasCardio) indicators += '<div class="dot cardio"></div>';
                
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                
                bodyEl.innerHTML += `<div class="${classes}" onclick="openDaySummary('${dateStr}')">${day}<div class="cal-indicators">${indicators}</div></div>`;
            }
        }

        // === MODAL RESUMEN CON TONELAJE ===
        function openDaySummary(dateStr) {
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const routines = getMergedRoutines();
            const [y, m, d] = dateStr.split('-');
            const targetDate = new Date(y, m-1, d);
            
            const sessions = history.filter(w => {
                const wDate = new Date(w.date);
                return wDate.getFullYear() == y && wDate.getMonth() == m-1 && wDate.getDate() == d;
            });

            const modal = document.getElementById('day-modal');
            const title = document.getElementById('modal-date-title');
            const container = document.getElementById('modal-summaries');
            
            title.textContent = targetDate.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            container.innerHTML = '';

            if (sessions.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:30px;">Día de descanso.</p>';
                modal.classList.add('active'); return;
            }

            sessions.forEach(s => {
                const sDate = new Date(s.date);
                const timeStr = s.startTime || sDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const timeEndStr = s.endTime ? ` - ${s.endTime}` : '';
                const sessionId = s.id || s.date; // Para poder editar
                
                if (s.type === 'cardio') {
                    let html = `<div class="summary-card cardio-theme">
                        <h4>🏃 ${s.modality} <span style="float:right; font-size:0.8rem; color:var(--text-muted); font-weight:normal;">${timeStr}${timeEndStr}</span></h4>
                        <div class="summary-detail">⏱️ ${s.duration} min ${s.distance ? `| 📏 ${s.distance} km` : ''} ${s.cal ? `| 🔥 ${s.cal} kcal` : ''}</div>
                        ${s.fcMed || s.fcMax ? `<div class="summary-detail">❤️ FC: ${s.fcMed||'-'} med / ${s.fcMax||'-'} max</div>` : ''}
                        ${s.notes ? `<div class="summary-detail" style="margin-top:8px; font-style:italic; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px;">"${s.notes}"</div>` : ''}
                        <div style="text-align:right;"><button class="btn-edit-small" onclick="editPastWorkout('${sessionId}')">✏️ Editar</button></div>
                    </div>`;
                    container.innerHTML += html;
                } else {
                    const rTitle = s.dayId && routines[s.dayId] ? routines[s.dayId].title : "Fuerza";
                    let sessionTonnage = 0;

                    let html = `<div class="summary-card">
                        <h4>💪 ${rTitle} <span style="float:right; font-size:0.8rem; color:var(--text-muted); font-weight:normal;">${timeStr}${timeEndStr}</span></h4>`;
                    
                    for (const exId in s.exercises) {
                        const name = s.exerciseMetadata && s.exerciseMetadata[exId] ? s.exerciseMetadata[exId].name : "Ejercicio";
                        const sets = s.exercises[exId].filter(set => set.weight !== "" || set.reps !== "");
                        if(sets.length > 0) {
                            html += `<div style="margin-top:12px; font-weight:600; font-size:0.9rem; color:var(--text-color);">${name}</div><div class="stat-sets" style="margin-top:5px;">`;
                            sets.forEach((set, idx) => {
                                let w = parseFloat(set.weight); let r = parseInt(set.reps);
                                if(!isNaN(w) && !isNaN(r)) sessionTonnage += (w * r); // Calcular tonelaje
                                let rirStr = set.rir ? ` <span style="color:#14b8a6; font-size:0.7rem;">(RIR ${set.rir})</span>` : '';
                                html += `<span class="stat-set-badge">S${idx+1}: ${set.weight||'-'}kg × ${set.reps||'-'}${rirStr}</span>`;
                            });
                            html += `</div>`;
                        }
                    }
                    if(sessionTonnage > 0) {
                        html += `<div class="tonnage-badge">📦 Tonelaje Total: ${sessionTonnage.toLocaleString('es-ES')} kg</div>`;
                    }
                    html += `<div style="text-align:right; border-top:1px solid var(--border-color); margin-top:10px;"><button class="btn-edit-small" onclick="editPastWorkout('${sessionId}')">✏️ Editar Sesión</button></div></div>`;
                    container.innerHTML += html;
                }
            });
            modal.classList.add('active');
        }

        function closeModal(event) { document.getElementById('day-modal').classList.remove('active'); }

        // === EXPORT / IMPORT ===
        function exportBackup() {
            const data = { workout_history: JSON.parse(localStorage.getItem('workout_history') || '[]'), custom_routines: JSON.parse(localStorage.getItem('custom_routines') || '{}'), hidden_routines: JSON.parse(localStorage.getItem('hidden_routines') || '[]') };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tracker_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); showToast("Backup exportado 💾");
        }
        function importBackup(event) {
            const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result); if (!importedData.workout_history) return alert("Archivo no válido.");
                    if (confirm("⚠️ Importar sobrescribirá tus datos actuales. ¿Seguro?")) {
                        localStorage.setItem('workout_history', JSON.stringify(importedData.workout_history || [])); localStorage.setItem('custom_routines', JSON.stringify(importedData.custom_routines || {})); localStorage.setItem('hidden_routines', JSON.stringify(importedData.hidden_routines || []));
                        showToast("Datos restaurados ✅"); event.target.value = ''; setTimeout(() => location.reload(), 800);
                    }
                } catch (error) { alert("Error al leer el JSON."); }
            }; reader.readAsText(file);
        }
        function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.className = "show"; setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000); }
        // Editor routines config omitido por espacio visual aquí, pero el código de guardado/borrado es el mismo.
        function addBuilderExerciseRow(ex=null){const exId=ex?ex.id:`cust_${Date.now()}_${Math.floor(Math.random()*1000)}`;const name=ex?ex.name:'';const sets=ex?ex.sets:'';const target=ex?ex.target:'';const muscle=ex?ex.muscle:'';let optionsHtml='<option value="">-- Músculo --</option>';muscleOptions.forEach(opt=>{optionsHtml+=`<option value="${opt}" ${opt===muscle?'selected':''}>${opt}</option>`;});const rowHtml=`<div class="builder-row" data-exid="${exId}"><div class="builder-inputs"><input type="text" class="b-name" placeholder="Nombre Ejercicio" value="${name}"><div class="builder-flex"><select class="b-muscle" style="flex:2;">${optionsHtml}</select><input type="number" inputmode="numeric" class="b-sets" placeholder="Series" style="flex:1;" value="${sets}"><input type="text" class="b-target" placeholder="Reps" style="flex:2;" value="${target}"></div></div><button class="btn-delete" style="padding: 0 12px; background: transparent; border: none; font-size:1.5rem;" onclick="this.parentElement.remove()">&times;</button></div>`;document.getElementById('builder-exercises').insertAdjacentHTML('beforeend',rowHtml);}
        function saveCustomRoutine(){const name=document.getElementById('new-routine-name').value.trim();const rule=document.getElementById('new-routine-rule').value.trim();if(!name){alert("Ponle un nombre a la rutina");return;}const rows=document.querySelectorAll('.builder-row');let exercises=[];rows.forEach(row=>{const exId=row.getAttribute('data-exid');const exName=row.querySelector('.b-name').value.trim();const muscle=row.querySelector('.b-muscle').value||M_OTHER;const sets=parseInt(row.querySelector('.b-sets').value)||3;const target=row.querySelector('.b-target').value.trim()||"-";if(exName){exercises.push({id:exId,name:exName,muscle:muscle,sets:sets,target:target});}});if(exercises.length===0){alert("Añade al menos un ejercicio");return;}let routineId=document.getElementById('routine-edit-select').value;if(routineId==='NEW')routineId='custom_'+Date.now();const customRoutines=JSON.parse(localStorage.getItem('custom_routines')||'{}');customRoutines[routineId]={title:name,rule:rule,exercises:exercises};localStorage.setItem('custom_routines',JSON.stringify(customRoutines));localStorage.removeItem('draft_'+routineId);showToast("Rutina Guardada");populateBuilderDropdown();document.getElementById('routine-edit-select').value=routineId;}
        function deleteCurrentRoutine(){const routineId=document.getElementById('routine-edit-select').value;if(routineId==='NEW')return;if(confirm("¿Seguro que quieres borrar esta rutina?")){const hiddenRoutines=JSON.parse(localStorage.getItem('hidden_routines')||'[]');if(!hiddenRoutines.includes(routineId)){hiddenRoutines.push(routineId);localStorage.setItem('hidden_routines',JSON.stringify(hiddenRoutines));}showToast("Rutina eliminada");populateBuilderDropdown();loadRoutineForEdit();}}
    </script>
</body>
