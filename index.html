<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Torso/Pierna V4</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --danger-color: #cf6679;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; font-size: 1.3rem; color: var(--primary-color); }

        nav.main-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            background: var(--bg-color);
        }

        button {
            background-color: var(--surface-color);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            transition: 0.2s;
        }

        button.active, button:active { background-color: var(--primary-color); color: var(--bg-color); }
        .btn-secondary { background-color: transparent; border: 1px dashed var(--primary-color); color: var(--primary-color); width: 100%; padding: 12px; margin-bottom: 15px; }
        .btn-delete { background-color: rgba(207, 102, 121, 0.1); border: 1px solid var(--danger-color); color: var(--danger-color); font-size: 1.2rem; cursor: pointer; padding: 0 12px; border-radius: 8px;}
        .btn-save { background-color: var(--primary-color); color: var(--bg-color); width: 100%; padding: 15px; font-size: 1.1rem; border: none; margin-top: 10px; margin-bottom: 30px; border-radius: 8px; }

        .container { padding: 0 15px 80px 15px; }
        .section { display: none; }
        .section.active { display: block; }

        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .card { background-color: var(--surface-color); border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .card h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .card .target { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        .muscle-tag { background-color: rgba(3, 218, 198, 0.15); color: var(--secondary-color); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }

        .set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .set-row span { width: 60px; font-weight: bold; font-size: 0.9rem;}
        .set-row input { margin-bottom: 0; text-align: center; }

        .rule-box { background-color: rgba(187, 134, 252, 0.1); border-left: 4px solid var(--primary-color); padding: 10px 15px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; }

        /* Estilos Builder */
        .builder-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);}
        .builder-row input, .builder-row select { margin-bottom: 0; }
        .builder-inputs { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .builder-flex { display: flex; gap: 8px; }

        /* Sub-Navegación de Estadísticas */
        .stats-nav { display: flex; gap: 5px; margin-bottom: 15px; }
        .stats-nav button { font-size: 0.8rem; padding: 8px 5px; border-color: var(--border-color); color: var(--text-muted); }
        .stats-nav button.active { background-color: var(--surface-color); color: var(--primary-color); border-color: var(--primary-color); }
        .stat-view { display: none; }
        .stat-view.active { display: block; }

        /* Vistas de Estadísticas */
        .stat-row { display: flex; flex-direction: column; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .stat-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; color: var(--primary-color); }
        .stat-sets { display: flex; flex-wrap: wrap; gap: 8px; }
        .stat-set-badge { background-color: rgba(255,255,255,0.05); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; color: var(--text-muted); }
        
        .habit-block { text-align: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .habit-block h4 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 0.9rem; }
        .habit-block .number { font-size: 2.5rem; font-weight: bold; color: var(--primary-color); margin: 0;}
        .day-bar-container { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.85rem;}
        .day-bar-label { width: 80px; text-align: right; }
        .day-bar-track { flex-grow: 1; background: var(--bg-color); height: 12px; border-radius: 6px; overflow: hidden; }
        .day-bar-fill { height: 100%; background: var(--secondary-color); width: 0%; transition: width 0.5s; }
        .day-bar-count { width: 30px; font-weight: bold; }

        #toast { visibility: hidden; min-width: 250px; background-color: var(--secondary-color); color: #000; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 1rem; font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.4s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <header>
        <h1>Tracker Torso/Pierna</h1>
    </header>

    <nav class="main-nav">
        <button id="btn-train" class="active" onclick="switchTab('train')">Entrenar</button>
        <button id="btn-build" onclick="switchTab('build')">Editor</button>
        <button id="btn-stats" onclick="switchTab('stats')">Datos</button>
    </nav>

    <div class="container">
        <!-- SECCIÓN ENTRENAR -->
        <div id="section-train" class="section active">
            <select id="day-selector" onchange="loadDay()">
                <option value="">-- Selecciona el Entrenamiento --</option>
            </select>
            <div id="workout-container"></div>
        </div>

        <!-- SECCIÓN CREAR / EDITAR RUTINAS -->
        <div id="section-build" class="section">
            <div class="card" style="background-color: var(--bg-color); border:none; padding:0;">
                <select id="routine-edit-select" onchange="loadRoutineForEdit()" style="border-color: var(--primary-color); border-width: 2px;">
                    <option value="NEW">+ Crear Nueva Rutina</option>
                </select>
            </div>
            <div class="card">
                <input type="text" id="new-routine-name" placeholder="Nombre (ej. Torso C, Push, etc.)">
                <input type="text" id="new-routine-rule" placeholder="Regla/Nota (ej. Descanso 2 min)">
                
                <div id="builder-exercises"></div>
                
                <button class="btn-secondary" onclick="addBuilderExerciseRow()">+ Añadir Ejercicio a la rutina</button>
                <div style="display:flex; gap:10px; margin-top: 20px;">
                    <button id="btn-delete-routine" onclick="deleteCurrentRoutine()" style="display:none; background-color: transparent; border: 1px solid var(--danger-color); color: var(--danger-color);">🗑️ Eliminar</button>
                    <button class="btn-save" onclick="saveCustomRoutine()" style="margin:0;">Guardar Rutina</button>
                </div>
            </div>
        </div>

        <!-- SECCIÓN ESTADÍSTICAS -->
        <div id="section-stats" class="section">
            <div class="stats-nav">
                <button id="sbtn-habits" class="active" onclick="switchStatView('habits')">Hábitos</button>
                <button id="sbtn-muscles" onclick="switchStatView('muscles')">Volumen</button>
                <button id="sbtn-exercises" onclick="switchStatView('exercises')">Historial</button>
            </div>

            <!-- Vista Hábitos -->
            <div id="stat-view-habits" class="stat-view active card">
                <h3>Resumen (Últimos 30 días)</h3>
                <div id="habits-container"></div>
            </div>

            <!-- Vista Músculos -->
            <div id="stat-view-muscles" class="stat-view card">
                <h3>Series Efectivas (Últimos 30 días)</h3>
                <div class="target" style="margin-bottom: 15px;">Mide el volumen de trabajo por músculo</div>
                <div id="muscles-container"></div>
            </div>

            <!-- Vista Ejercicios -->
            <div id="stat-view-exercises" class="stat-view card">
                <select id="stat-exercise-selector" onchange="loadExerciseStats()">
                    <option value="">-- Selecciona un Ejercicio --</option>
                </select>
                <div id="stats-list"></div>
            </div>
        </div>
    </div>

    <div id="toast">✅ ¡Acción completada!</div>

    <script>
        const M_CHEST = "Pecho", M_BACK = "Espalda", M_SHOULDER = "Hombros", M_QUADS = "Cuádriceps", M_HAMS = "Isquios", M_GLUTES = "Glúteos", M_BICEPS = "Bíceps", M_TRICEPS = "Tríceps", M_CALVES = "Gemelos", M_CORE = "Core", M_OTHER = "Otro";

        const muscleOptions = [M_CHEST, M_BACK, M_SHOULDER, M_QUADS, M_HAMS, M_GLUTES, M_BICEPS, M_TRICEPS, M_CALVES, M_CORE, M_OTHER];

        const baseRoutine = {
            dia1: { title: "DÍA 1: Torso A", rule: "Excéntrica 3 seg. Descanso: 60-90s.", exercises: [
                { id: "d1_jalon", name: "Jalón al pecho (Neutro/V)", sets: 4, target: "8-10 reps", muscle: M_BACK },
                { id: "d1_press", name: "Press pecho convergente", sets: 4, target: "8-10 reps", muscle: M_CHEST },
                { id: "d1_elev", name: "Elevaciones laterales", sets: 4, target: "12-15 reps", muscle: M_SHOULDER },
                { id: "d1_tri", name: "Tríceps polea alta", sets: 3, target: "10-12 reps", muscle: M_TRICEPS },
                { id: "d1_bi", name: "Curl bíceps Scott", sets: 3, target: "10-12 reps", muscle: M_BICEPS },
                { id: "d1_pl", name: "Plancha retroversión", sets: 3, target: "40 seg", muscle: M_CORE }
            ]},
            dia2: { title: "DÍA 2: Pierna A", rule: "Excéntrica 3 seg. Columna neutra. Descanso: 90s.", exercises: [
                { id: "d2_hip", name: "Hip Thrust", sets: 4, target: "8-10 reps", muscle: M_GLUTES },
                { id: "d2_pren", name: "Prensa Inclinada", sets: 4, target: "10-12 reps", muscle: M_QUADS },
                { id: "d2_curl", name: "Curl Isquios sentado", sets: 4, target: "10-12 reps", muscle: M_HAMS },
                { id: "d2_ext", name: "Silla Romana (Glúteo)", sets: 3, target: "12-15 reps", muscle: M_GLUTES },
                { id: "d2_gem", name: "Gemelos de pie", sets: 3, target: "15 reps", muscle: M_CALVES }
            ]},
            dia3: { title: "DÍA 3: Torso B", rule: "Excéntrica 3 seg. Descanso: 60-90s.", exercises: [
                { id: "d3_rem", name: "Remo pecho apoyado", sets: 4, target: "8-10 reps", muscle: M_BACK },
                { id: "d3_pinc", name: "Press inclinado Mancuernas", sets: 3, target: "8-10 reps", muscle: M_CHEST },
                { id: "d3_land", name: "Landmine Press (1 brazo)", sets: 3, target: "8-10 reps", muscle: M_SHOULDER },
                { id: "d3_face", name: "Face Pull polea alta", sets: 4, target: "15 reps", muscle: M_BACK },
                { id: "d3_tri", name: "Extensiones tríceps cruzadas", sets: 3, target: "12 reps", muscle: M_TRICEPS },
                { id: "d3_bi", name: "Curl bíceps martillo", sets: 3, target: "12 reps", muscle: M_BICEPS }
            ]},
            dia4: { title: "DÍA 4: Pierna B (Casa)", rule: "Densidad metabólica. Descanso: 60-90s.", exercises: [
                { id: "d4_bul", name: "Sentadilla Búlgara", sets: 4, target: "8-10 reps / pierna", muscle: M_QUADS },
                { id: "d4_push", name: "Flexiones estrictas", sets: 3, target: "Al fallo", muscle: M_CHEST },
                { id: "d4_bst", name: "B-Stance RDL", sets: 3, target: "12 reps / pierna", muscle: M_HAMS },
                { id: "d4_abd", name: "Abducción cadera (Banda)", sets: 3, target: "15 reps / pierna", muscle: M_GLUTES },
                { id: "d4_pal", name: "Press Pallof", sets: 3, target: "12 reps / lado", muscle: M_CORE },
                { id: "d4_bird", name: "Bird-Dog", sets: 3, target: "10 reps / lado", muscle: M_CORE }
            ]}
        };

        // Combina base con las modificadas/creadas y oculta las eliminadas
        function getMergedRoutines() {
            const custom = JSON.parse(localStorage.getItem('custom_routines') || '{}');
            const hidden = JSON.parse(localStorage.getItem('hidden_routines') || '[]');
            let merged = JSON.parse(JSON.stringify(baseRoutine)); // Deep copy
            Object.assign(merged, custom);
            hidden.forEach(id => { delete merged[id]; });
            return merged;
        }

        window.onload = function() {
            populateDaySelector();
            populateBuilderDropdown();
            loadRoutineForEdit();
        };

        /* --- NAVEGACIÓN PRINCIPAL --- */
        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav.main-nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(`section-${tab}`).classList.add('active');
            document.getElementById(`btn-${tab}`).classList.add('active');

            if(tab === 'train') populateDaySelector();
            if(tab === 'build') populateBuilderDropdown();
            if(tab === 'stats') {
                populateStatsDropdown();
                renderHabitsStats();
                renderMuscleStats();
            }
        }

        /* --- LÓGICA DE ENTRENAMIENTO --- */
        function populateDaySelector() {
            const selector = document.getElementById('day-selector');
            const currentVal = selector.value;
            selector.innerHTML = '<option value="">-- Selecciona el Entrenamiento --</option>';
            const routines = getMergedRoutines();
            
            for (const key in routines) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = routines[key].title;
                selector.appendChild(option);
            }
            // Restaurar selección si la rutina sigue existiendo
            if (routines[currentVal]) selector.value = currentVal; 
        }

        function loadDay() {
            const dayKey = document.getElementById('day-selector').value;
            const container = document.getElementById('workout-container');
            container.innerHTML = '';
            if (!dayKey) return;

            const routines = getMergedRoutines();
            const dayData = routines[dayKey];
            
            const draft = JSON.parse(localStorage.getItem('draft_' + dayKey) || 'null');
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const lastWorkout = history.filter(w => w.dayId === dayKey).pop();

            let html = `<div class="rule-box"><strong>Nota:</strong> ${dayData.rule || ''}</div>`;
            html += `<div id="exercise-list">`;

            if (draft && draft.exercises && draft.exercises.length > 0) {
                draft.exercises.forEach((ex, index) => {
                    html += buildCardHTML(ex.id, ex.name, ex.target, ex.muscle, ex.sets, index + 1);
                });
            } else {
                dayData.exercises.forEach((ex, index) => {
                    let prefilledSets = [];
                    for (let i = 0; i < ex.sets; i++) {
                        let w = "", r = "";
                        if (lastWorkout && lastWorkout.exercises[ex.id] && lastWorkout.exercises[ex.id][i]) {
                            w = lastWorkout.exercises[ex.id][i].weight;
                            r = lastWorkout.exercises[ex.id][i].reps;
                        }
                        prefilledSets.push({ weight: w, reps: r });
                    }
                    html += buildCardHTML(ex.id, ex.name, ex.target, ex.muscle, prefilledSets, index + 1);
                });
            }

            html += `</div>`;
            html += `<button class="btn-secondary" onclick="addExtraExercise('${dayKey}')">+ Añadir Ejercicio Extra (Puntual)</button>`;
            html += `<button class="btn-save" onclick="saveWorkout('${dayKey}')">Guardar Entrenamiento</button>`;
            
            container.innerHTML = html;
        }

        function buildCardHTML(id, name, target, muscle, setsData, index = "*") {
            const safeMuscle = muscle || M_OTHER;
            let html = `
            <div class="card workout-card" id="ex-${id}" data-name="${name}" data-target="${target}" data-muscle="${safeMuscle}">
                <h3 class="ex-title"><span>${index}. ${name}</span></h3>
                <div class="target">
                    <span>${target}</span>
                    <span class="muscle-tag">${safeMuscle}</span>
                </div>
            `;
            setsData.forEach((set, i) => {
                html += `
                <div class="set-row">
                    <span>Serie ${i + 1}</span>
                    <input type="number" step="0.5" class="weight-input" placeholder="Kg/Extra" value="${set.weight}" oninput="autoSaveDraft()">
                    <input type="number" class="reps-input" placeholder="Reps" value="${set.reps}" oninput="autoSaveDraft()">
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        function addExtraExercise(dayKey) {
            const name = prompt("Nombre del ejercicio extra:");
            if (!name) return;
            const numSets = parseInt(prompt("Número de series:", "3")) || 3;
            const target = prompt("Repeticiones objetivo:", "8-12 reps") || "";
            
            const exId = 'extra_' + Date.now();
            let emptySets = Array(numSets).fill({ weight: "", reps: "" });
            
            const list = document.getElementById('exercise-list');
            const currentIndex = list.querySelectorAll('.workout-card').length + 1;
            
            const muscleChoice = prompt(`Grupo muscular (Escribe una opción: ${muscleOptions.join(", ")}):`, M_OTHER);
            
            list.insertAdjacentHTML('beforeend', buildCardHTML(exId, name, target, muscleChoice, emptySets, currentIndex));
            autoSaveDraft();
        }

        function autoSaveDraft() {
            const dayKey = document.getElementById('day-selector').value;
            if(!dayKey) return;

            const cards = document.querySelectorAll('.workout-card');
            const draftData = { exercises: [] };

            cards.forEach(card => {
                const exId = card.id.replace('ex-', '');
                const sets = [];
                card.querySelectorAll('.weight-input').forEach((wInput, i) => {
                    const rInput = card.querySelectorAll('.reps-input')[i];
                    sets.push({ weight: wInput.value, reps: rInput.value });
                });
                draftData.exercises.push({ 
                    id: exId, 
                    name: card.getAttribute('data-name'), 
                    target: card.getAttribute('data-target'),
                    muscle: card.getAttribute('data-muscle'),
                    sets: sets 
                });
            });
            localStorage.setItem('draft_' + dayKey, JSON.stringify(draftData));
        }

        function saveWorkout(dayId) {
            const cards = document.querySelectorAll('.workout-card');
            if(cards.length === 0) return;

            const workoutRecord = {
                date: new Date().toISOString(),
                dayId: dayId,
                exercises: {},
                exerciseMetadata: {} 
            };

            cards.forEach(card => {
                const exId = card.id.replace('ex-', '');
                const name = card.getAttribute('data-name');
                const muscle = card.getAttribute('data-muscle');
                let setsData = [];
                
                card.querySelectorAll('.weight-input').forEach((wInput, i) => {
                    const rInput = card.querySelectorAll('.reps-input')[i];
                    setsData.push({ weight: wInput.value || "", reps: rInput.value || "" });
                });
                workoutRecord.exercises[exId] = setsData;
                workoutRecord.exerciseMetadata[exId] = { name: name, muscle: muscle };
            });

            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            history.push(workoutRecord);
            localStorage.setItem('workout_history', JSON.stringify(history));
            localStorage.removeItem('draft_' + dayId);
            
            showToast("Entrenamiento guardado");
            document.getElementById('day-selector').value = "";
            document.getElementById('workout-container').innerHTML = "";
        }

        /* --- LÓGICA DEL BUILDER (Editor de Rutinas) --- */
        function populateBuilderDropdown() {
            const select = document.getElementById('routine-edit-select');
            const currentVal = select.value;
            select.innerHTML = '<option value="NEW">+ Crear Nueva Rutina</option>';
            
            const routines = getMergedRoutines();
            for (const key in routines) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = "Editar: " + routines[key].title;
                select.appendChild(option);
            }
            // Restaurar selección
            if (currentVal === 'NEW' || routines[currentVal]) {
                select.value = currentVal;
            }
        }

        function loadRoutineForEdit() {
            const id = document.getElementById('routine-edit-select').value;
            const container = document.getElementById('builder-exercises');
            container.innerHTML = '';
            
            if (id === 'NEW') {
                document.getElementById('new-routine-name').value = '';
                document.getElementById('new-routine-rule').value = '';
                document.getElementById('btn-delete-routine').style.display = 'none';
                addBuilderExerciseRow();
                return;
            }

            const routines = getMergedRoutines();
            const routine = routines[id];
            
            document.getElementById('new-routine-name').value = routine.title;
            document.getElementById('new-routine-rule').value = routine.rule || '';
            document.getElementById('btn-delete-routine').style.display = 'block';

            routine.exercises.forEach(ex => addBuilderExerciseRow(ex));
        }

        function addBuilderExerciseRow(ex = null) {
            const exId = ex ? ex.id : `cust_${Date.now()}_${Math.floor(Math.random()*1000)}`;
            const name = ex ? ex.name : '';
            const sets = ex ? ex.sets : '';
            const target = ex ? ex.target : '';
            const muscle = ex ? ex.muscle : '';

            let optionsHtml = '<option value="">-- Músculo --</option>';
            muscleOptions.forEach(opt => {
                optionsHtml += `<option value="${opt}" ${opt === muscle ? 'selected' : ''}>${opt}</option>`;
            });

            const rowHtml = `
            <div class="builder-row" data-exid="${exId}">
                <div class="builder-inputs">
                    <input type="text" class="b-name" placeholder="Nombre Ejercicio" value="${name}">
                    <div class="builder-flex">
                        <select class="b-muscle" style="flex:2;">${optionsHtml}</select>
                        <input type="number" class="b-sets" placeholder="Series" style="flex:1;" value="${sets}">
                        <input type="text" class="b-target" placeholder="Objetivo" style="flex:2;" value="${target}">
                    </div>
                </div>
                <button class="btn-delete" onclick="this.parentElement.remove()">✕</button>
            </div>`;
            
            document.getElementById('builder-exercises').insertAdjacentHTML('beforeend', rowHtml);
        }

        function saveCustomRoutine() {
            const name = document.getElementById('new-routine-name').value.trim();
            const rule = document.getElementById('new-routine-rule').value.trim();
            if(!name) { alert("Ponle un nombre a la rutina"); return; }

            const rows = document.querySelectorAll('.builder-row');
            let exercises = [];
            
            rows.forEach(row => {
                const exId = row.getAttribute('data-exid');
                const exName = row.querySelector('.b-name').value.trim();
                const muscle = row.querySelector('.b-muscle').value || M_OTHER;
                const sets = parseInt(row.querySelector('.b-sets').value) || 3;
                const target = row.querySelector('.b-target').value.trim() || "-";
                
                if(exName) {
                    exercises.push({ id: exId, name: exName, muscle: muscle, sets: sets, target: target });
                }
            });

            if(exercises.length === 0) { alert("Añade al menos un ejercicio"); return; }

            let routineId = document.getElementById('routine-edit-select').value;
            if (routineId === 'NEW') {
                routineId = 'custom_' + Date.now();
            }

            const customRoutines = JSON.parse(localStorage.getItem('custom_routines') || '{}');
            customRoutines[routineId] = { title: name, rule: rule, exercises: exercises };
            localStorage.setItem('custom_routines', JSON.stringify(customRoutines));

            // Si editas una rutina, limpiamos su borrador activo por si había desajustes de ejercicios
            localStorage.removeItem('draft_' + routineId);

            showToast("Rutina Guardada con éxito");
            populateBuilderDropdown();
            document.getElementById('routine-edit-select').value = routineId;
        }

        function deleteCurrentRoutine() {
            const routineId = document.getElementById('routine-edit-select').value;
            if(routineId === 'NEW') return;

            if(confirm("¿Seguro que quieres borrar esta rutina? Tus entrenamientos anteriores seguirán en las estadísticas.")) {
                const hiddenRoutines = JSON.parse(localStorage.getItem('hidden_routines') || '[]');
                if (!hiddenRoutines.includes(routineId)) {
                    hiddenRoutines.push(routineId);
                    localStorage.setItem('hidden_routines', JSON.stringify(hiddenRoutines));
                }
                
                showToast("Rutina eliminada");
                populateBuilderDropdown();
                loadRoutineForEdit(); // Vuelve a 'NEW'
            }
        }

        /* --- SUB-NAVEGACIÓN ESTADÍSTICAS --- */
        function switchStatView(viewId) {
            document.querySelectorAll('.stat-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.stats-nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(`stat-view-${viewId}`).classList.add('active');
            document.getElementById(`sbtn-${viewId}`).classList.add('active');
        }

        /* --- MOTOR ANALÍTICO --- */
        function getRecentHistory(days = 30) {
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            return history.filter(w => new Date(w.date) >= cutoff);
        }

        function renderHabitsStats() {
            const history30 = getRecentHistory(30);
            const container = document.getElementById('habits-container');
            
            if (history30.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>No hay datos de los últimos 30 días.</p>";
                return;
            }

            const dayNames = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const dayCounts = [0,0,0,0,0,0,0];
            
            history30.forEach(w => {
                const dateObj = new Date(w.date);
                dayCounts[dateObj.getDay()]++;
            });

            const maxDays = Math.max(...dayCounts);
            const totalWorkouts = history30.length;
            const favDayIdx = dayCounts.indexOf(maxDays);

            let html = `
                <div class="habit-block">
                    <h4>Total Entrenamientos</h4>
                    <div class="number">${totalWorkouts}</div>
                </div>
                <div class="habit-block">
                    <h4>Día más frecuente</h4>
                    <div style="font-size:1.2rem; font-weight:bold; color:var(--primary-color);">${dayNames[favDayIdx]} (${maxDays} veces)</div>
                </div>
                <div style="margin-top: 20px;">
                    <h4 style="margin-bottom:15px; color:var(--text-muted);">Distribución Semanal</h4>
            `;

            const order = [1, 2, 3, 4, 5, 6, 0]; // Lunes a Domingo
            order.forEach(dayIdx => {
                const count = dayCounts[dayIdx];
                const width = maxDays > 0 ? (count / maxDays) * 100 : 0;
                html += `
                <div class="day-bar-container">
                    <div class="day-bar-label">${dayNames[dayIdx].substring(0,3)}.</div>
                    <div class="day-bar-track">
                        <div class="day-bar-fill" style="width: ${width}%;"></div>
                    </div>
                    <div class="day-bar-count">${count}</div>
                </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderMuscleStats() {
            const history30 = getRecentHistory(30);
            const container = document.getElementById('muscles-container');
            
            if (history30.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:var(--text-muted);'>No hay datos de los últimos 30 días.</p>";
                return;
            }

            const muscleTally = {};
            
            history30.forEach(workout => {
                for (const exId in workout.exercises) {
                    const sets = workout.exercises[exId];
                    const validSets = sets.filter(s => s.weight !== "" || s.reps !== "").length;
                    
                    if (validSets > 0 && workout.exerciseMetadata && workout.exerciseMetadata[exId]) {
                        const m = workout.exerciseMetadata[exId].muscle || M_OTHER;
                        muscleTally[m] = (muscleTally[m] || 0) + validSets;
                    }
                }
            });

            const sortedMuscles = Object.keys(muscleTally).sort((a,b) => muscleTally[b] - muscleTally[a]);
            
            if (sortedMuscles.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>Ninguna serie registrada válida.</p>";
                return;
            }

            const maxSets = muscleTally[sortedMuscles[0]];
            let html = "";

            sortedMuscles.forEach(m => {
                const count = muscleTally[m];
                const width = (count / maxSets) * 100;
                html += `
                <div class="day-bar-container">
                    <div class="day-bar-label" style="text-align:left;">${m}</div>
                    <div class="day-bar-track">
                        <div class="day-bar-fill" style="width: ${width}%; background: var(--primary-color);"></div>
                    </div>
                    <div class="day-bar-count">${count}</div>
                </div>`;
            });

            container.innerHTML = html;
        }

        /* --- LÓGICA DE HISTORIAL DE EJERCICIOS --- */
        function populateStatsDropdown() {
            const select = document.getElementById('stat-exercise-selector');
            select.innerHTML = '<option value="">-- Selecciona un Ejercicio --</option>';
            
            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const routines = getMergedRoutines();
            let allExercises = {};

            // Priorizar nombres de rutinas activas
            Object.values(routines).forEach(day => {
                day.exercises.forEach(ex => { allExercises[ex.id] = ex.name; });
            });

            // Añadir históricos de rutinas borradas o ejercicios extra
            history.forEach(workout => {
                if(workout.exerciseMetadata) {
                    Object.keys(workout.exerciseMetadata).forEach(id => {
                        if (!allExercises[id]) {
                            allExercises[id] = workout.exerciseMetadata[id].name;
                        }
                    });
                }
            });

            const sortedIds = Object.keys(allExercises).sort((a, b) => allExercises[a].localeCompare(allExercises[b]));
            
            sortedIds.forEach(id => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = allExercises[id];
                select.appendChild(option);
            });
        }

        function loadExerciseStats() {
            const exId = document.getElementById('stat-exercise-selector').value;
            const list = document.getElementById('stats-list');
            if (!exId) { list.innerHTML = ''; return; }

            const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
            const exStats = [];

            history.forEach(workout => {
                if (workout.exercises[exId]) {
                    const hasData = workout.exercises[exId].some(set => set.weight !== "" || set.reps !== "");
                    if (hasData) {
                        const dateObj = new Date(workout.date);
                        exStats.push({ date: dateObj.toLocaleDateString(), sets: workout.exercises[exId] });
                    }
                }
            });

            if (exStats.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No hay datos registrados aún.</p>';
                return;
            }

            list.innerHTML = "";
            exStats.reverse().forEach(stat => {
                let setsHtml = '';
                stat.sets.forEach((set, idx) => {
                    if (set.weight !== "" || set.reps !== "") {
                        const w = set.weight !== "" ? set.weight + 'kg' : '-';
                        const r = set.reps !== "" ? set.reps : '-';
                        setsHtml += `<div class="stat-set-badge">S${idx + 1}: ${w} × ${r}</div>`;
                    }
                });
                list.innerHTML += `<div class="stat-row"><div class="stat-header"><span>${stat.date}</span></div><div class="stat-sets">${setsHtml}</div></div>`;
            });
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }
    </script>
